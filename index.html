<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PlateLoad — skip the plate math</title>
    <meta
      name="description"
      content="Type a weight and PlateLoad finds every way to load it with the plates your gym owns — drawn as a real barbell. Free, no account, works offline."
    />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:title" content="PlateLoad — skip the plate math" />
    <meta property="og:description" content="Every way to load a barbell with the plates your gym actually owns." />
    <script>
      // The calculator used to live at /. Installs from then still launch here, and
      // links shared from then carry its settings (?w=100&u=kg…) — send both on.
      try {
        var q = new URLSearchParams(location.search)
        var installed = matchMedia('(display-mode: standalone)').matches || navigator.standalone
        if (installed || q.has('w') || q.has('brand') || q.has('u')) location.replace('/app/' + location.search)
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=Unbounded:wght@600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
